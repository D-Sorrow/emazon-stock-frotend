<ng-container *ngIf="isTextarea; else inputTemplate">
    <textarea
        class="textarea"
        [(ngModel)]="value"
        [placeholder]="placeholder"
        [required]="required"
        (input)="onInput($event)"
    ></textarea>
</ng-container>
<ng-template #inputTemplate>
    <input
    class="input"
    [type]="type"
    [(ngModel)]="value"
    [placeholder]="placeholder"
    [required]="required"
    (input)="onInput($event)"
    />
</ng-template>
