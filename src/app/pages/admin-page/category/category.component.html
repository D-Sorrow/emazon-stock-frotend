<div class="container">
    <app-form class="container__form" 
    [fields]="fields"
    [formType]= "formType"
    (formSubmitted)="saveData($event)"
    [formTitle]="'Añade una categoría'"
    >
    </app-form>
    <app-table [items]="categories"></app-table>
    <app-pagination-bar (sortItem)="sortItem()" [pageSize]="pagesSize" (nextPage)="nextPage()" (prevPage)="previousPage()"></app-pagination-bar>
</div>
